name: sync-upstream
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to rebase onto (default: latest release)"
        required: false
      dry_run:
        description: "Rebase and test only; do not push or open PRs"
        type: boolean
        default: true
      verify_app:
        description: "Only check the GitHub App token and its repository access"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  verify-app:
    if: inputs.verify_app == true
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WILE_E_SYNC_APP_ID }}
          private-key: ${{ secrets.WILE_E_SYNC_APP_PRIVATE_KEY }}
          owner: Qumulo-IT
          repositories: step-ca,wile-e

      - name: Check repository access
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          repos=$(gh api /installation/repositories --jq '.repositories[].full_name' | sort | tr '\n' ' ')
          echo "app ${SLUG}: ${repos}"
          [ "$repos" = "Qumulo-IT/step-ca Qumulo-IT/wile-e " ]
          gh api "/users/${SLUG}[bot]" --jq '"bot user id: \(.id)"'

  sync:
    if: inputs.verify_app != true
    runs-on: ubuntu-latest
    steps:
      - name: Require app config
        if: inputs.dry_run != true
        env:
          APP_ID: ${{ vars.WILE_E_SYNC_APP_ID }}
          APP_KEY: ${{ secrets.WILE_E_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "WILE_E_SYNC_APP_ID variable and WILE_E_SYNC_APP_PRIVATE_KEY secret are required for non-dry-run" >&2
            exit 1
          fi

      - name: Create app token
        id: app
        if: inputs.dry_run != true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WILE_E_SYNC_APP_ID }}
          private-key: ${{ secrets.WILE_E_SYNC_APP_PRIVATE_KEY }}
          owner: Qumulo-IT
          repositories: step-ca,wile-e

      - name: Resolve git identity
        id: ident
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ -n "$SLUG" ]; then
            uid=$(gh api "/users/${SLUG}[bot]" --jq .id)
            echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
            echo "email=${uid}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
          else
            echo "name=wile-e sync" >> "$GITHUB_OUTPUT"
            echo "email=wile-e-sync@users.noreply.github.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve target tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(gh api repos/smallstep/certificates/releases/latest --jq .tag_name)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "wile_tag=$tag-wile.1" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: wile-e/patches
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Skip if already published
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.tag.outputs.wile_tag }}" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase patch onto upstream tag
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "${{ steps.ident.outputs.name }}"
          git config user.email "${{ steps.ident.outputs.email }}"
          git remote add upstream https://github.com/smallstep/certificates.git
          git fetch upstream --tags
          git rebase --onto "${{ steps.tag.outputs.tag }}" HEAD~1

      - uses: actions/setup-go@v5
        if: steps.check.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.check.outputs.skip != 'true'
        run: go test ./acme/... ./ca/... ./authority/provisioner/...

      - name: Publish branch
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true
        run: git push --force-with-lease origin HEAD:wile-e/patches

      - name: Tag release
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          git tag "${{ steps.tag.outputs.wile_tag }}"
          git push origin "${{ steps.tag.outputs.wile_tag }}"

      - name: Open PR in wile-e
        id: pr
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GIT_NAME: ${{ steps.ident.outputs.name }}
          GIT_EMAIL: ${{ steps.ident.outputs.email }}
          TAG: ${{ steps.tag.outputs.tag }}
          WILE_TAG: ${{ steps.tag.outputs.wile_tag }}
        run: |
          if [ "$(gh pr list -R Qumulo-IT/wile-e --head "deps/step-ca-$TAG" --state all --json number -q length)" != "0" ]; then
            echo "PR for deps/step-ca-$TAG already exists"
            exit 0
          fi
          gh auth setup-git
          gh repo clone Qumulo-IT/wile-e wile-e
          cd wile-e
          branch="deps/step-ca-$TAG"
          git switch -c "$branch"
          go mod edit -require="github.com/smallstep/certificates@$TAG" \
            -replace="github.com/smallstep/certificates=github.com/Qumulo-IT/step-ca@$WILE_TAG"
          go mod tidy
          git -c user.name="$GIT_NAME" -c user.email="$GIT_EMAIL" \
            commit -am "Bump step-ca to $TAG"
          git push --force origin "$branch"
          url=$(gh pr create --title "Bump step-ca to $TAG" \
            --body "Rebased async finalize patch onto smallstep/certificates $TAG ($WILE_TAG)." \
            --assignee evilhamsterman \
            --reviewer hasenek,bcalhoun-qumulo,cliffordmiller,lwnemesis)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: steps.pr.outputs.url != ''
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WILE_E_SLACK_WEBHOOK_URL }}
          TAG: ${{ steps.tag.outputs.tag }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::WILE_E_SLACK_WEBHOOK_URL not set; skipping Slack notification"
            exit 0
          fi
          jq -n --arg tag "$TAG" --arg url "$PR_URL" \
            '{text: "step-ca \($tag) released — patch rebased, tests passed. wile-e bump PR: \($url)"}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Sync to ${{ steps.tag.outputs.tag }} failed" \
            --body "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
